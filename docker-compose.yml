services:
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: askoff-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q '\"cluster_name\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - askoff-os-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - ASKOFF_ENVIRONMENT=development
      - ASKOFF_RAW_DATA_PATH=/app/data/raw/normalized.parquet
      - ASKOFF_OPENSEARCH_INDEX=askoff_products
      - ASKOFF_OPENSEARCH_HOSTS=["opensearch:9200"]
    command: ["python", "scripts/bootstrap_index.py"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askoff-api
    depends_on:
      indexer:
        condition: service_completed_successfully
    environment:
      - ASKOFF_RAW_DATA_PATH=/app/data/raw/normalized.parquet
      - ASKOFF_OPENSEARCH_INDEX=askoff_products
      - ASKOFF_OPENSEARCH_HOSTS=["opensearch:9200"]
      - ASKOFF_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://127.0.0.1:5173","http://127.0.0.1:3000"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  askoff-os-data:
